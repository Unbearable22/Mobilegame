name: Android debug APK
on:
  push:
    branches: [main, feat/chain-react-mvp]
  pull_request:
  workflow_dispatch:
    inputs:
      allow_ephemeral_signing:
        description: 'Explicitly build with a NONPERSISTENT test certificate if signing Secrets are absent'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare private debug signing (fail closed)
        id: signing
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_STORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_STORE_PASSWORD }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
          ALLOW_EPHEMERAL: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_ephemeral_signing == true }}
        run: |
          set -euo pipefail
          signing_args=()
          if [[ "$ALLOW_EPHEMERAL" == "true" ]]; then
            signing_args+=(--allow-ephemeral-signing)
          fi
          python3 tools/setup_debug_signing.py prepare-ci \
            --directory "$RUNNER_TEMP/chain-react-signing" "${signing_args[@]}"
          if [[ -f "$RUNNER_TEMP/chain-react-signing/signing-config.json" ]]; then
            echo 'label=persistent-debug' >> "$GITHUB_OUTPUT"
          else
            echo 'label=EPHEMERAL-NONPERSISTENT' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android packages
        run: sdkmanager 'platform-tools' 'build-tools;36.0.0' 'platforms;android-36'
      - name: Install matching Godot and Android templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates"
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" templates/android_debug.apk templates/android_release.apk templates/version.txt -d "$RUNNER_TEMP/templates"
      - name: Test, build and verify debug ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          signing_args=()
          if [[ -f "$RUNNER_TEMP/chain-react-signing/signing-config.json" ]]; then
            signing_args+=(--signing-config "$RUNNER_TEMP/chain-react-signing/signing-config.json")
          elif [[ "${{ github.event_name == 'workflow_dispatch' && inputs.allow_ephemeral_signing == true }}" == "true" ]]; then
            echo '::warning::NONPERSISTENT debug certificate; APK updates are not guaranteed.'
            signing_args+=(--allow-ephemeral-signing)
          else
            echo '::error::Stable signing is required. Configure the four Secrets described in docs/android-signing.md.'
            exit 1
          fi
          python3 tools/build_android.py "${signing_args[@]}" \
            --godot "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --sdk "$ANDROID_HOME" --java "$JAVA_HOME" \
            --templates "$RUNNER_TEMP/templates/templates" 2>&1 | tee build/android/build.log
      - name: Upload verified APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: chain-react-debug-arm64-${{ steps.signing.outputs.label }}-${{ github.sha }}
          path: build/android/
          if-no-files-found: error
          retention-days: 14
      - name: Remove private signing material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/chain-react-signing"
